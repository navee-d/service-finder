spring:
  application:
    name: sf-gallery-application

  # ⭐ FIXED: Increased file upload limits to 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    properties:
      hibernate:
        column_ordering_strategy: legacy
    hibernate:
      ddl-auto: 'update'
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sf_gallery_application_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0827}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  error:
    include-message: ALWAYS
  port: 8082

object-storage:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ROOT_USER:minioadmin}
  secretKey: ${MINIO_ROOT_PASSWORD:minioadmin}
  image-part-size: 5242880
  doc-part-size: 5242880
  buckets:
    documents: classpath:minio-policies/documents-policy.json
    images: classpath:minio-policies/images-policy.json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true