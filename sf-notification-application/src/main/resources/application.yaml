server:
  port: 8086
  error:
    include-message: always

spring:
  application:
    # ⭐ IMPORTANT: Must be notification-application
    name: sf-notification-application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  # File upload limits
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Database Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/servicefinder_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0827}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        column_ordering_strategy: legacy

  # ⭐ MAIL CONFIGURATION (This was missing)
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

spring.cloud:
  compatibility-verifier:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true