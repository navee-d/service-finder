spring:
  application:
    name: sf-gallery-application
  jpa:
    properties:
      hibernate:
        column_ordering_strategy: legacy
    hibernate:
      ddl-auto: 'create'
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sf_gallery_application_db?createDatabaseIfNotExist=true
  profiles:
    active: development
  jackson:
    serialization:
      fail-on-empty-beans: false
server:
  error:
    include-message: ALWAYS
  port: 8081
object-storage:
  bucket-policy-config-dir: sf-gallery-application/src/main/resources/bucket_policy_config
  image-part-size: 5 * 1024 * 1024L
  doc-part-size: 10 * 1024 * 1024L
  endpoint: http://127.0.0.1:9000
  buckets:
     images: "${object-storage.bucket-policy-config-dir}/imagebucketpolicy.json"
     documents: "${object-storage.bucket-policy-config-dir}/documentsbucketpolicy.json"