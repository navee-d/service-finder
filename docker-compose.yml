version: '3.8'

services:
  # --- Infrastructure ---
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "0827"
      MYSQL_DATABASE: servicefinder_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # --- Discovery Server ---
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  # --- API Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    restart: unless-stopped

  # --- User Management ---
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-user-management-application
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Service Application ---
  service-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-service-application
    container_name: service-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Provider Service ---
  provider-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-provider-application
    container_name: provider-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Booking Service ---
  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-booking-application
    container_name: booking-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Gallery Service ---a
  gallery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-gallery-application
    container_name: gallery-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - minio
      - discovery-server
    restart: unless-stopped

  # --- Review Service ---
  review-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-review-application
    container_name: review-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Payment Service ---
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-payment-application
    container_name: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- Notification Service ---
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-notification-application
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

  # --- FAQ Service ---
  faq-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: sf-faq-application
    container_name: faq-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "0827"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - mysql
      - discovery-server
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  maven_repo:
